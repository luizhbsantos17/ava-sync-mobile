name: ava_sync_mobile
description: "AVA Sync: seu Moodle no celular (prazos, materiais, avisos e entregas)."
publish_to: 'none'
version: 1.0.1+14

environment:
  sdk: ^3.14.0

dependencies:
  archive: ^4.7.0
  cryptography: ^2.9.0
  device_calendar_plus: ^0.12.0
  file_picker: ^13.3.3
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.2
  flutter_secure_storage: ^11.2.0
  flutter_widget_from_html_core: ^0.17.4
  html: ^0.15.7
  http: ^1.6.0
  markdown: ^7.3.1
  material_ui: ^1.1.0
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  tray_manager: ^0.9.0
  url_launcher: ^6.3.3
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_windows: ^0.4.0
  window_manager: ^0.7.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
