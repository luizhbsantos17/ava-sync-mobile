name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TEM_CHAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Assinatura opcional: cadastre os secrets (veja o README). Sem eles, usa a chave de debug.
      - name: Preparar keystore
        if: env.TEM_CHAVE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > android/app/release.jks

      - name: Compilar APK
        env:
          ANDROID_STOREFILE: ${{ env.TEM_CHAVE == 'true' && 'release.jks' || '' }}
          ANDROID_STOREPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk AVA-Sync.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AVA-Sync-apk
          path: AVA-Sync.apk

      - name: Publicar no Release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AVA-Sync.apk --prerelease --title "AVA Sync (última versão)" \
            --notes "APK gerado automaticamente a partir de ${GITHUB_SHA::7}. Baixe AVA-Sync.apk pelo celular e instale."
