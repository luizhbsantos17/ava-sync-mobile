name: Gerar APK oficial

on:
  push:
    branches: [main]
    # Mudança só de documentação não gera APK novo.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/pull_request_template.md'
      - '.github/copilot-instructions.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TEM_CHAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Toda versão oficial precisa de notas no CHANGELOG.md (veja AGENTS.md).
      - name: Conferir notas da versão no CHANGELOG
        run: bash scripts/notas_versao.sh "$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')" > /dev/null

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Assinatura opcional: cadastre os secrets (veja o README). Sem eles, usa a chave de debug.
      - name: Preparar keystore
        if: env.TEM_CHAVE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > android/app/release.jks

      - name: Compilar APK oficial
        env:
          ANDROID_STOREFILE: ${{ env.TEM_CHAVE == 'true' && 'release.jks' || '' }}
          ANDROID_STOREPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor production \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define=AVA_SYNC_CHANNEL=production \
            --dart-define=AVA_SYNC_BUILD="$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-production-release.apk AVA-Sync.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AVA-Sync-apk
          path: AVA-Sync.apk

      - name: Publicar release oficial "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')
          gh release delete latest --yes --cleanup-tag || true
          {
            printf 'Build: %s\nVersão: %s\nCommit: %s\n\n' "$GITHUB_RUN_NUMBER" "$versao" "${GITHUB_SHA::7}"
            bash scripts/notas_versao.sh "$versao"
          } > release-notes.md
          gh release create latest AVA-Sync.apk --title "AVA Sync $versao (build $GITHUB_RUN_NUMBER)" --notes-file release-notes.md
