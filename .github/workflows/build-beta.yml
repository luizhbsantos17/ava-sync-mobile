name: Gerar APK beta e apps de computador

on:
  push:
    branches: [beta, 'feature/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
      - '.claude/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk-beta:
    runs-on: ubuntu-latest
    env:
      TEM_CHAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # os pacotes de janela e bandeja do computador compilam código nativo até nos testes
      - name: Bibliotecas do Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev libx11-dev libxi-dev libsecret-1-dev

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Preparar keystore
        if: env.TEM_CHAVE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KS" | base64 -d > android/app/release.jks

      - name: Compilar APK beta
        env:
          # push do Social (Firebase); sem os secrets o APK sai sem push
          FCM_API_KEY: ${{ secrets.FCM_API_KEY }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SENDER_ID: ${{ secrets.FCM_SENDER_ID }}
          FCM_APP_ID: ${{ secrets.FCM_APP_ID }}
          FCM_APP_ID_BETA: ${{ secrets.FCM_APP_ID_BETA }}
          ANDROID_STOREFILE: ${{ env.TEM_CHAVE == 'true' && 'release.jks' || '' }}
          ANDROID_STOREPASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYPASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --flavor beta \
            --build-number "$GITHUB_RUN_NUMBER" \
            --dart-define=AVA_SYNC_CHANNEL=beta \
            --dart-define=AVA_SYNC_BUILD="$GITHUB_RUN_NUMBER"
          cp build/app/outputs/flutter-apk/app-beta-release.apk AVA-Sync-Beta.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AVA-Sync-beta
          path: AVA-Sync-Beta.apk

      - name: Publicar pré-lançamento "beta"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*([^+]+).*/\1/')
          gh release delete beta --yes --cleanup-tag || true
          {
            printf 'Build: %s\nVersão: %s (teste)\nCommit: %s\n\n' "$GITHUB_RUN_NUMBER" "$versao" "${GITHUB_SHA::7}"
            bash scripts/notas_versao.sh "Não lançado" 2>/dev/null \
              || bash scripts/notas_versao.sh "$versao" 2>/dev/null \
              || echo 'Versão de testes. Instala ao lado do AVA Sync oficial.'
          } > release-notes.md
          gh release create beta AVA-Sync-Beta.apk --title "AVA Sync Beta (build $GITHUB_RUN_NUMBER)" --notes-file release-notes.md --prerelease

  # Windows, Linux e macOS: mesmo commit, mesmo build, mesma release (veja desktop.yml)
  computador:
    needs: apk-beta
    uses: ./.github/workflows/desktop.yml
    with:
      canal: beta
      tag: beta
